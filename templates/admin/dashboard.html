{% extends "admin/base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h4>Dashboard</h4>
        <p class="grey-text text-darken-1">Overview of teams, players, and matches.</p>
    </div>
</div>

<div class="row">
    <div class="col s12 m4">
        <div class="card stat-card">
            <div class="card-content">
                <span class="card-title">Total Teams</span>
                <p class="stat-value">{{ total_teams }}</p>
            </div>
        </div>
    </div>
    <div class="col s12 m4">
        <div class="card stat-card">
            <div class="card-content">
                <span class="card-title">Total Players</span>
                <p class="stat-value">{{ total_players }}</p>
            </div>
        </div>
    </div>
    <div class="col s12 m4">
        <div class="card stat-card">
            <div class="card-content">
                <span class="card-title">Total Matches</span>
                <p class="stat-value">{{ total_matches }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
